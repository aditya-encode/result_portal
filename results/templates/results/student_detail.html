{% extends 'results/base.html' %}
{% block content %}
<h2>{{ student.name }} ({{ student.roll_number }})</h2>
<table>
    <tr><th>Subject</th><th>Marks</th><th>Grade</th></tr>
    {% for r in student.results.all %}
    <tr><td>{{ r.subject }}</td><td>{{ r.marks }}</td><td>{{ r.grade }}</td></tr>
    {% empty %}
    <tr><td colspan="3">No results yet.</td></tr>
    {% endfor %}
</table>

<h3>Add Result</h3>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Add</button>
</form>
{% endblock %}
