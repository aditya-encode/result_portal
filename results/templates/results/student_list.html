{% extends 'results/base.html' %}
{% block content %}
<h2>Students</h2>
<table>
    <tr><th>Roll No</th><th>Name</th><th>Email</th><th>Actions</th></tr>
    {% for s in students %}
    <tr>
        <td>{{ s.roll_number }}</td>
        <td><a href="{% url 'student_detail' s.pk %}">{{ s.name }}</a></td>
        <td>{{ s.email }}</td>
        <td>
            <a href="{% url 'student_edit' s.pk %}">Edit</a> |
            <a href="{% url 'student_delete' s.pk %}">Delete</a>
        </td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No students yet.</td></tr>
    {% endfor %}
</table>
{% endblock %}
